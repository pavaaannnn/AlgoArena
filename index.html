<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoArena | The Future of Coding Practice</title>
    <style>
        /* =========================================
           CSS VARIABLES & RESET
           ========================================= */
        :root {
            --bg-dark: #07070B;
            --surface: #10111A;
            --card-bg: rgba(22, 24, 39, 0.6);
            --primary: #4CC9F0;
            --secondary: #7B61FF;
            --accent: #C026D3;
            --highlight: #A855F7;
            --text-main: #F8FAFC;
            --text-muted: #A1A1AA;
            --border: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --gradient-primary: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            --shadow-glow: 0 0 20px rgba(76, 201, 240, 0.15);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --ease-out: cubic-bezier(0.215, 0.61, 0.355, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--secondary); }

        /* =========================================
           BACKGROUND ANIMATION (AURORA)
           ========================================= */
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 15% 50%, rgba(76, 201, 240, 0.08), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(192, 38, 211, 0.08), transparent 25%);
            overflow: hidden;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: floatOrb 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 300px; height: 300px; background: var(--accent); bottom: 10%; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 200px; height: 200px; background: var(--secondary); top: 40%; left: 40%; animation-delay: -10s; }
        
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* =========================================
           UTILITIES & COMPONENTS
           ========================================= */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .grid { display: grid; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; } .gap-4 { gap: 1rem; } .gap-6 { gap: 1.5rem; }
        
        /* Glass Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            transition: all 0.3s var(--ease-out);
            position: relative;
            overflow: hidden;
        }
        .glass-card:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .glass-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s; border: none; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px;
        }
        .btn-primary {
            background: var(--gradient-primary); color: white;
            box-shadow: 0 4px 15px rgba(123, 97, 255, 0.3);
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(123, 97, 255, 0.5); }
        .btn-secondary {
            background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--text-muted); }
        .btn-icon { padding: 8px; border-radius: 8px; background: transparent; color: var(--text-muted); }
        .btn-icon:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }

        /* Badges */
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-easy { background: rgba(16, 185, 129, 0.15); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge-medium { background: rgba(251, 191, 36, 0.15); color: #FBBF24; border: 1px solid rgba(251, 191, 36, 0.2); }
        .badge-hard { background: rgba(239, 68, 68, 0.15); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-company { background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid var(--border); margin-right: 4px;}

        /* Inputs */
        input, select, textarea {
            background: rgba(0,0,0,0.2); border: 1px solid var(--border); color: var(--text-main);
            padding: 0.75rem 1rem; border-radius: 10px; width: 100%; font-family: inherit; transition: 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.2); }

        /* =========================================
           NAVBAR
           ========================================= */
        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(7, 7, 11, 0.8); backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); padding: 1rem 0;
        }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 800; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; cursor: pointer; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-item { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: 0.2s; cursor: pointer; position: relative; }
        .nav-item:hover, .nav-item.active { color: var(--text-main); }
        .nav-item.active::after { content: ''; position: absolute; bottom: -4px; left: 0; width: 100%; height: 2px; background: var(--primary); border-radius: 2px; }

        /* =========================================
           SECTIONS
           ========================================= */
        section { padding: 4rem 0; min-height: 80vh; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Hero */
        .hero { text-align: center; padding: 8rem 0; }
        .hero h1 { font-size: 4rem; font-weight: 800; line-height: 1.1; margin-bottom: 1.5rem; letter-spacing: -1px; }
        .hero h1 span { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.25rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 2.5rem; }

        /* Dashboard Grid */
        .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { padding: 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .stat-val { font-size: 2rem; font-weight: 700; color: var(--text-main); }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; }

        /* Problem List */
        .filters-bar { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 300px; position: relative; }
        .problem-table { width: 100%; border-collapse: separate; border-spacing: 0 0.5rem; }
        .problem-row { background: var(--card-bg); transition: 0.2s; cursor: pointer; }
        .problem-row:hover { background: rgba(255,255,255,0.05); transform: scale(1.01); }
        .problem-cell { padding: 1rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
        .problem-cell:first-child { border-left: 1px solid var(--border); border-radius: 12px 0 0 12px; }
        .problem-cell:last-child { border-right: 1px solid var(--border); border-radius: 0 12px 12px 0; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .status-solved { background: #34D399; box-shadow: 0 0 8px #34D399; }
        .status-todo { background: var(--text-muted); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000;
            display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-content {
            width: 90%; max-width: 900px; height: 85vh; background: var(--surface);
            border: 1px solid var(--border); border-radius: 24px; display: flex; flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.95); transition: 0.3s;
        }
        .modal-overlay.open .modal-content { transform: scale(1); }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 2rem; overflow-y: auto; flex: 1; }
        .modal-footer { padding: 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 1rem; }
        
        /* Charts */
        canvas { width: 100%; height: 200px; }

        /* Leaderboard */
        .lb-row { display: grid; grid-template-columns: 0.5fr 2fr 1fr 1fr 1fr; padding: 1rem; border-bottom: 1px solid var(--border); align-items: center; }
        .lb-header { font-weight: 700; color: var(--text-muted); border-bottom: 2px solid var(--border); }
        .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--gradient-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; margin-right: 10px; }

        /* Toast */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: rgba(22, 24, 39, 0.9); backdrop-filter: blur(10px); border: 1px solid var(--border);
            padding: 1rem 1.5rem; border-radius: 12px; color: var(--text-main);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: translateX(120%); transition: 0.4s var(--ease-out);
            display: flex; align-items: center; gap: 10px; min-width: 300px;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 4px solid #34D399; }
        .toast.info { border-left: 4px solid var(--primary); }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .dash-grid { grid-template-columns: 1fr 1fr; }
            .nav-links { display: none; } /* Simplified mobile menu for brevity */
            .lb-row { grid-template-columns: 1fr 1fr; gap: 10px; }
            .lb-header { display: none; }
        }
    </style>
</head>
<body>

    <!-- Aurora Background -->
    <div class="aurora-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navbar -->
    <nav>
        <div class="container nav-content">
            <div class="logo" onclick="app.router('home')">AlgoArena</div>
            <div class="nav-links">
                <a class="nav-item active" data-target="home" onclick="app.router('home')">Dashboard</a>
                <a class="nav-item" data-target="problems" onclick="app.router('problems')">Problems</a>
                <a class="nav-item" data-target="contests" onclick="app.router('contests')">Contests</a>
                <a class="nav-item" data-target="leaderboard" onclick="app.router('leaderboard')">Leaderboard</a>
                <a class="nav-item" data-target="profile" onclick="app.router('profile')">Profile</a>
            </div>
            <div class="flex items-center gap-4">
                <button class="btn-icon" onclick="app.toggleTheme()">🌙</button>
                <div class="avatar">U</div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-root" class="container">
        <!-- Views injected here by JS -->
    </main>

    <!-- Problem Details Modal -->
    <div id="problem-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Problem Title</h2>
                <button class="btn-icon" onclick="ui.closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="flex gap-2 mb-4">
                    <span id="modal-diff" class="badge">Medium</span>
                    <span id="modal-acc" class="badge badge-company">Acc: 85%</span>
                </div>
                <div id="modal-desc" style="margin-bottom: 2rem; line-height: 1.8;"></div>
                
                <h3>Examples</h3>
                <div id="modal-examples" class="glass-card p-4 mb-4" style="padding:1rem; font-family: monospace; background: rgba(0,0,0,0.3);"></div>
                
                <h3>Constraints</h3>
                <ul id="modal-constraints" style="margin-left: 1.5rem; color: var(--text-muted); margin-bottom: 2rem;"></ul>

                <h3>Notes</h3>
                <textarea id="modal-notes" rows="3" placeholder="Add your personal notes here..." oninput="app.saveNote(this.value)"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.toggleBookmark(ui.currentProblemId)">
                    <span id="modal-bm-icon">☆</span> Bookmark
                </button>
                <button class="btn btn-primary" onclick="app.markSolved(ui.currentProblemId)">
                    Mark Solved
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        /**
         * ALGOARENA CORE ENGINE
         * Handles Data, State, UI Rendering, and Logic
         */

        // --- 1. DATA GENERATION ---
        const TOPICS = ['Arrays', 'Strings', 'Graphs', 'Trees', 'DP', 'Linked List', 'HashMap', 'Sorting', 'Binary Search', 'Recursion'];
        const COMPANIES = ['Google', 'Amazon', 'Microsoft', 'Apple', 'Meta', 'Netflix', 'Uber', 'Adobe'];
        const DIFFICULTIES = ['Easy', 'Medium', 'Hard'];

        // Generate 100 Realistic Problems
        const generateProblems = () => {
            const problems = [];
            const titles = [
                "Two Sum", "Reverse Linked List", "Valid Parentheses", "Merge Two Sorted Lists", 
                "Best Time to Buy Stock", "Product of Array Except Self", "Maximum Subarray", 
                "Longest Palindromic Substring", "Container With Most Water", "3Sum",
                "Letter Combinations", "Remove Nth Node From End", "Generate Parentheses", 
                "Swap Nodes in Pairs", "Divide Two Integers", "Next Permutation", "Search in Rotated Array",
                "Valid Sudoku", "Combination Sum", "Multiply Strings", "Jump Game II", "Permutations",
                "Group Anagrams", "Maximum Gap", "LRU Cache", "Sort Colors", "Minimum Window Substring",
                "Combinatorics Challenge", "Matrix Spiral", "Rotate Image", "Set Matrix Zeroes",
                "Gas Station", "Candy Crush Logic", "Single Number III", "Word Break", "Linked List Cycle",
                "Min Stack", "Intersection of Two Arrays", "First Missing Positive", "Trapping Rain Water",
                "Wildcard Matching", "N-Queens", "Sudoku Solver", "Jump Game", "Merge Intervals",
                "Insert Interval", "Length of Last Word", "Spiral Matrix II", "Rotate List", 
                "Unique Paths", "Plus One", "Add Binary", "Text Justification", "Sqrt(x)", 
                "Climbing Stairs", "Edit Distance", "Set Mismatch", "Degree of an Array",
                "1-bit and 2-bit Characters", "Find Pivot Index", "Dominant Index", "Max Chunks To Make Sorted",
                "Partition Labels", "Reorganize String", "Global and Local Inversions", "Shortest Distance to a Character",
                "Flipping an Image", "Magic Squares In Grid", "Keys and Rooms", "Split Array into Consecutive Subsequences",
                "Image Smoother", "Max Area of Island", "Count Binary Substrings", "Kth Largest Element",
                "Top K Frequent Elements", "Product of Array Except Self", "Find Duplicate Number",
                "Game of Life", "First Unique Character", "Ransom Note", "Isomorphic Strings",
                "Word Pattern", "Valid Anagram", "Missing Number", "Move Zeroes", "Power of Three",
                "Counting Bits", "House Robber", "Number of Islands", "Happy Number", "Reverse Bits",
                "Palindrome Linked List", "Delete Node in Linked List", "Contains Duplicate", "Majority Element",
                "Excel Sheet Column Title", "Factorial Trailing Zeroes", "Binary Tree Paths", "Add Digits",
                "Ugly Number", "Invert Binary Tree", "Summary Ranges", "Power of Two", "Lowest Common Ancestor"
            ];

            for (let i = 1; i <= 100; i++) {
                const diff = DIFFICULTIES[Math.floor(Math.random() * 3)];
                const topic = TOPICS[Math.floor(Math.random() * TOPICS.length)];
                const company = COMPANIES[Math.floor(Math.random() * COMPANIES.length)];
                
                problems.push({
                    id: i,
                    title: titles[i-1] || `Algorithm Challenge ${i}`,
                    difficulty: diff,
                    acceptance: Math.floor(Math.random() * 40) + 40,
                    tags: [topic],
                    companies: [company],
                    solved: false,
                    bookmarked: false,
                    description: `<p>Given an array of integers, return indices of the two numbers such that they add up to a specific target.</p><p>You may assume that each input would have exactly one solution, and you may not use the same element twice.</p>`,
                    examples: `<div>Input: nums = [2,7,11,15], target = 9<br>Output: [0,1]<br>Explanation: Because nums[0] + nums[1] == 9, we return [0, 1].</div>`,
                    constraints: ["1 <= nums.length <= 10^4", "-10^9 <= nums[i] <= 10^9"],
                    notes: ""
                });
            }
            return problems;
        };

        // --- 2. STATE MANAGEMENT ---
        const store = {
            user: {
                name: "DevUser",
                streak: 12,
                solved: [], // Array of IDs
                bookmarks: [], // Array of IDs
                notes: {}, // Map ID -> Text
                history: [] // For calendar
            },
            problems: [],
            currentFilter: { search: '', difficulty: 'All', tag: 'All' },
            
            init() {
                // Load from LS or Init
                const savedUser = localStorage.getItem('algo_user');
                if (savedUser) this.user = JSON.parse(savedUser);
                
                // Initialize problems (always fresh list but merge user state)
                const rawProblems = generateProblems();
                this.problems = rawProblems.map(p => ({
                    ...p,
                    solved: this.user.solved.includes(p.id),
                    bookmarked: this.user.bookmarks.includes(p.id),
                    notes: this.user.notes[p.id] || ""
                }));

                this.save();
            },

            save() {
                // Sync state back to simple user object for storage
                this.user.solved = this.problems.filter(p => p.solved).map(p => p.id);
                this.user.bookmarks = this.problems.filter(p => p.bookmarked).map(p => p.id);
                this.problems.forEach(p => { if(p.notes) this.user.notes[p.id] = p.notes; });
                
                localStorage.setItem('algo_user', JSON.stringify(this.user));
            },

            getStats() {
                const solved = this.problems.filter(p => p.solved);
                return {
                    totalSolved: solved.length,
                    easy: solved.filter(p => p.difficulty === 'Easy').length,
                    medium: solved.filter(p => p.difficulty === 'Medium').length,
                    hard: solved.filter(p => p.difficulty === 'Hard').length,
                    rate: Math.round((solved.length / this.problems.length) * 100)
                };
            }
        };

        // --- 3. UI CONTROLLER ---
        const ui = {
            root: document.getElementById('app-root'),
            modal: document.getElementById('problem-modal'),
            currentProblemId: null,

            render(viewName) {
                window.scrollTo(0,0);
                // Update Nav
                document.querySelectorAll('.nav-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.target === viewName);
                });

                switch(viewName) {
                    case 'home': this.renderDashboard(); break;
                    case 'problems': this.renderProblemList(); break;
                    case 'leaderboard': this.renderLeaderboard(); break;
                    case 'contests': this.renderContests(); break;
                    case 'profile': this.renderProfile(); break;
                    default: this.renderDashboard();
                }
            },

            renderDashboard() {
                const stats = store.getStats();
                this.root.innerHTML = `
                    <section class="hero">
                        <h1>Master Algorithms.<br><span>Ace Your Interviews.</span></h1>
                        <p>The premium platform for coding practice. Join 10,000+ developers solving problems daily.</p>
                        <div class="flex justify-center gap-4">
                            <button class="btn btn-primary" onclick="app.router('problems')">Start Solving</button>
                            <button class="btn btn-secondary" onclick="app.router('contests')">Join Contest</button>
                        </div>
                    </section>

                    <div class="dash-grid">
                        <div class="glass-card stat-card">
                            <div class="stat-val">${stats.totalSolved}</div>
                            <div class="stat-label">Problems Solved</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-val" style="color:#34D399">${stats.easy}</div>
                            <div class="stat-label">Easy Solved</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-val" style="color:#FBBF24">${stats.medium}</div>
                            <div class="stat-label">Medium Solved</div>
                        </div>
                        <div class="glass-card stat-card">
                            <div class="stat-val" style="color:#F87171">${stats.hard}</div>
                            <div class="stat-label">Hard Solved</div>
                        </div>
                    </div>

                    <div class="grid" style="grid-template-columns: 2fr 1fr; gap: 2rem;">
                        <div class="glass-card" style="padding: 2rem;">
                            <h3>Activity Heatmap</h3>
                            <canvas id="activityChart"></canvas>
                        </div>
                        <div class="glass-card" style="padding: 2rem;">
                            <h3>Daily Challenge</h3>
                            <div style="margin-top: 1rem;">
                                <span class="badge badge-medium">Medium</span>
                                <h4 style="margin: 10px 0;">Rotate Image</h4>
                                <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 1rem;">You are given an n x n 2D matrix representing an image, rotate the image by 90 degrees (clockwise).</p>
                                <button class="btn btn-primary" style="width:100%" onclick="app.openProblem(30)">Solve Now</button>
                            </div>
                        </div>
                    </div>
                `;
                this.drawChart();
            },

            drawChart() {
                const ctx = document.getElementById('activityChart');
                if(!ctx) return;
                // Simple Canvas Chart Implementation
                const w = ctx.width = ctx.parentElement.offsetWidth - 60;
                const h = ctx.height = 200;
                const c = ctx.getContext('2d');
                
                // Gradient
                const g = c.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, 'rgba(76, 201, 240, 0.5)');
                g.addColorStop(1, 'rgba(76, 201, 240, 0)');

                c.fillStyle = g;
                c.beginPath();
                c.moveTo(0, h);
                // Mock data wave
                for(let i=0; i<=w; i+=10) {
                    c.lineTo(i, h - (Math.sin(i/50)*30 + Math.random()*20 + 50));
                }
                c.lineTo(w, h);
                c.fill();
            },

            renderProblemList() {
                const filtered = store.problems.filter(p => {
                    const matchSearch = p.title.toLowerCase().includes(store.currentFilter.search.toLowerCase());
                    const matchDiff = store.currentFilter.difficulty === 'All' || p.difficulty === store.currentFilter.difficulty;
                    const matchTag = store.currentFilter.tag === 'All' || p.tags.includes(store.currentFilter.tag);
                    return matchSearch && matchDiff && matchTag;
                });

                let rows = filtered.map(p => `
                    <tr class="problem-row" onclick="app.openProblem(${p.id})">
                        <td class="problem-cell">
                            <span class="status-dot ${p.solved ? 'status-solved' : 'status-todo'}"></span>
                            ${p.title}
                        </td>
                        <td class="problem-cell"><span class="badge badge-${p.difficulty.toLowerCase()}">${p.difficulty}</span></td>
                        <td class="problem-cell" style="color:var(--text-muted)">${p.acceptance}%</td>
                        <td class="problem-cell">
                            ${p.companies.map(c => `<span class="badge-company">${c}</span>`).join('')}
                        </td>
                    </tr>
                `).join('');

                this.root.innerHTML = `
                    <section>
                        <h2 style="margin-bottom: 1.5rem;">Problem Set</h2>
                        <div class="filters-bar">
                            <div class="search-box">
                                <input type="text" placeholder="Search problems..." value="${store.currentFilter.search}" oninput="app.filterProblems('search', this.value)">
                            </div>
                            <select onchange="app.filterProblems('difficulty', this.value)" style="width: 150px;">
                                <option value="All">All Difficulties</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                            <select onchange="app.filterProblems('tag', this.value)" style="width: 150px;">
                                <option value="All">All Topics</option>
                                ${TOPICS.map(t => `<option value="${t}">${t}</option>`).join('')}
                            </select>
                        </div>
                        <div class="glass-card" style="overflow:hidden;">
                            <table class="problem-table">
                                <thead>
                                    <tr style="text-align:left; color:var(--text-muted); font-size:0.85rem; border-bottom:1px solid var(--border);">
                                        <th class="problem-cell">Title</th>
                                        <th class="problem-cell">Difficulty</th>
                                        <th class="problem-cell">Acceptance</th>
                                        <th class="problem-cell">Companies</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </section>
                `;
            },

            renderLeaderboard() {
                // Mock Data
                const leaders = [
                    { rank: 1, name: "Tourist", country: "BY", rating: 3900, solved: 1200 },
                    { rank: 2, name: "Benq", country: "US", rating: 3850, solved: 1150 },
                    { rank: 3, name: "ecnerwala", country: "US", rating: 3700, solved: 1080 },
                    { rank: 4, name: "Um_nik", country: "RU", rating: 3650, solved: 990 },
                    { rank: 5, name: "jiangly", country: "CN", rating: 3600, solved: 950 },
                ];

                this.root.innerHTML = `
                    <section>
                        <h2 style="margin-bottom: 2rem;">Global Leaderboard</h2>
                        <div class="glass-card">
                            <div class="lb-row lb-header">
                                <div>Rank</div><div>User</div><div>Country</div><div>Solved</div><div>Rating</div>
                            </div>
                            ${leaders.map(l => `
                                <div class="lb-row">
                                    <div style="font-weight:bold; color:${l.rank===1?'gold':l.rank===2?'silver':'inherit'}">#${l.rank}</div>
                                    <div class="flex items-center"><div class="avatar">${l.name[0]}</div> ${l.name}</div>
                                    <div>${l.country}</div>
                                    <div>${l.solved}</div>
                                    <div style="color:var(--primary); font-weight:bold;">${l.rating}</div>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            },

            renderContests() {
                this.root.innerHTML = `
                    <section>
                        <h2 style="margin-bottom: 2rem;">Upcoming Contests</h2>
                        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                            <div class="glass-card" style="padding: 2rem;">
                                <div class="badge badge-easy" style="margin-bottom: 1rem;">Weekly</div>
                                <h3>Weekly Contest 350</h3>
                                <p class="text-muted" style="margin: 10px 0;">Sunday, 10:30 AM GMT+8</p>
                                <div class="flex justify-between items-center mt-4">
                                    <span>Duration: 1h 30m</span>
                                    <button class="btn btn-primary" onclick="ui.showToast('Registered Successfully!', 'success')">Register</button>
                                </div>
                            </div>
                             <div class="glass-card" style="padding: 2rem;">
                                <div class="badge badge-medium" style="margin-bottom: 1rem;">Biweekly</div>
                                <h3>Biweekly Contest 110</h3>
                                <p class="text-muted" style="margin: 10px 0;">Saturday, 8:00 PM GMT+8</p>
                                <div class="flex justify-between items-center mt-4">
                                    <span>Duration: 1h 30m</span>
                                    <button class="btn btn-primary" onclick="ui.showToast('Registered Successfully!', 'success')">Register</button>
                                </div>
                            </div>
                        </div>
                    </section>
                `;
            },

            renderProfile() {
                const stats = store.getStats();
                this.root.innerHTML = `
                    <section>
                        <div class="glass-card" style="padding: 3rem; text-align: center;">
                            <div class="avatar" style="width: 80px; height: 80px; font-size: 2rem; margin: 0 auto 1rem;">U</div>
                            <h2>${store.user.name}</h2>
                            <p class="text-muted">Rank 12,403 • Global Top 5%</p>
                            
                            <div class="dash-grid" style="margin-top: 3rem;">
                                <div><h3>${stats.totalSolved}</h3><p class="text-muted">Solved</p></div>
                                <div><h3>${store.user.streak}</h3><p class="text-muted">Day Streak</p></div>
                                <div><h3>${store.user.bookmarks.length}</h3><p class="text-muted">Bookmarks</p></div>
                                <div><h3>${stats.rate}%</h3><p class="text-muted">Success Rate</p></div>
                            </div>
                        </div>
                    </section>
                `;
            },

            openModal(problem) {
                this.currentProblemId = problem.id;
                document.getElementById('modal-title').innerText = `${problem.id}. ${problem.title}`;
                document.getElementById('modal-diff').className = `badge badge-${problem.difficulty.toLowerCase()}`;
                document.getElementById('modal-diff').innerText = problem.difficulty;
                document.getElementById('modal-acc').innerText = `Acceptance: ${problem.acceptance}%`;
                document.getElementById('modal-desc').innerHTML = problem.description;
                document.getElementById('modal-examples').innerHTML = problem.examples;
                document.getElementById('modal-constraints').innerHTML = problem.constraints.map(c => `<li>${c}</li>`).join('');
                document.getElementById('modal-notes').value = problem.notes || "";
                document.getElementById('modal-bm-icon').innerText = problem.bookmarked ? '★' : '☆';
                
                this.modal.classList.add('open');
            },

            closeModal() {
                this.modal.classList.remove('open');
                this.currentProblemId = null;
            },

            showToast(msg, type='info') {
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.innerHTML = `<span>${type==='success'?'✓':'ℹ'}</span> ${msg}`;
                document.getElementById('toast-container').appendChild(t);
                
                // Trigger reflow
                requestAnimationFrame(() => t.classList.add('show'));
                
                setTimeout(() => {
                    t.classList.remove('show');
                    setTimeout(() => t.remove(), 400);
                }, 3000);
            }
        };

        // --- 4. APP LOGIC ---
        const app = {
            init() {
                store.init();
                ui.render('home');
                
                // Close modal on outside click
                document.getElementById('problem-modal').addEventListener('click', (e) => {
                    if(e.target.id === 'problem-modal') ui.closeModal();
                });
            },

            router(view) {
                ui.render(view);
            },

            filterProblems(key, value) {
                store.currentFilter[key] = value;
                ui.renderProblemList();
            },

            openProblem(id) {
                const p = store.problems.find(x => x.id === id);
                if(p) ui.openModal(p);
            },

            toggleBookmark(id) {
                const p = store.problems.find(x => x.id === id);
                if(p) {
                    p.bookmarked = !p.bookmarked;
                    document.getElementById('modal-bm-icon').innerText = p.bookmarked ? '★' : '☆';
                    store.save();
                    ui.showToast(p.bookmarked ? 'Added to Bookmarks' : 'Removed from Bookmarks', 'success');
                }
            },

            markSolved(id) {
                const p = store.problems.find(x => x.id === id);
                if(p && !p.solved) {
                    p.solved = true;
                    store.save();
                    ui.closeModal();
                    ui.showToast('Problem Solved! 🎉', 'success');
                    // Refresh if on list view
                    if(document.querySelector('.problem-table')) ui.renderProblemList();
                } else {
                    ui.showToast('Already Solved', 'info');
                }
            },

            saveNote(text) {
                if(ui.currentProblemId) {
                    const p = store.problems.find(x => x.id === ui.currentProblemId);
                    if(p) {
                        p.notes = text;
                        store.save();
                    }
                }
            },
            
            toggleTheme() {
                // Placeholder for theme toggle logic (currently dark only per spec)
                ui.showToast("Dark Mode Active", "info");
            }
        };

        // Start App
        window.addEventListener('DOMContentLoaded', () => app.init());

    </script>
</body>
</html>
